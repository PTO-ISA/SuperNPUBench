# 4-PE SPMD datapath config profile.
# Usage:  ./bin/gfsim -f <elf>                 # auto-detect: gfsim scans the ELF
#                                              # for a block carrying Shared
#                                              # B.IOS binders and applies this
#                                              # bundle when 4-PE.
#         ./bin/gfsim -f <elf> --conf fourpe   # force 4-PE (debug; skips detect)
#         ./bin/gfsim -f <elf> --conf <custom>  # explicit custom config (skips
#                                              # auto-detection)
#
# gfsim auto-detects 4-PE from the ELF instruction stream before BuildCore
# (issue #223); this bundle is loaded on 4-PE auto-detection or explicit
# `--conf fourpe`. Any explicit `--conf` entry now skips ELF auto-detection
# (issue #602), so a single-PE ELF stays single-PE unless `--conf fourpe` is
# passed. Runtime ordinary B.IOT `PE_MASK` suppresses non-participating
# threads; real B.IOS/GMMA blocks enable GroupLayer and use its sync gates.
#
# --pto-v02 defaults to true in the code (SimSys.h), so it is NOT required on
# the command line for 4-PE ELFs (or any ELF). Omit it unless forcing legacy
# v0.1 decoding.
#
# Source: modelSpec/4pe_datapath_modeling_spec.md §12.2 / §14 Step 6 / Assumptions A1-A4.
# Acceptance target (docs/sw_not_picked_debug_task_260802.md §1): threadCount=4,
# RC=0 + ReportStop=1. Keep this profile at smt=4; only lower it temporarily via -s.
#
# NOTE: 4-PE params are a bundle — stdPeCount/cube_core_num/vec_core_num gate
# instance count loops (BuildSTDPE/ConnectIEXIntf/BuildCubeCore/BuildVec), so keep
# them together in this file rather than hand-typing per run.
#
# Overriding a single bundle knob on a 4-PE ELF: gfsim auto-detect injects this
# bundle into the --conf path, so a `-s <knob>=<value>` that collides with a key
# here resolves against the bundle the same way `--conf fourpe -s <knob>=<value>`
# would. Because ConfigInput::Init stores the full "key=value" string and the
# config reader iterates an unordered map, two same-key/different-value entries
# resolve nondeterministically (last-iterated wins). To reliably override a
# sizing knob (e.g. bfu.brq_depth for a deadlock experiment), copy this file to
# a custom .conf with the knob edited, and pass `--conf <custom>` (which skips
# auto-detection) instead of `-s`.

# ---- scalar/PE instance counts (v1: 1 SPE + 4 SMT threads) ----
# v1 keeps stdPeCount=1: the scalar datapath still runs a single SPE with 4 SMT
# threads (spec §14 Step 6 deferred to the DispatchToPE refactor, R1). Setting
# stdPeCount=4 crashes at build time: IEX::Build()/ConnectIEXIntf() index
# core->peArray[peId] up to stdPeCount, but peArray holds only the single
# scalarPE pushed by BuildBCC -> BCtrlUnit::Build (see 4PE_REVIEW_补充_HANDOFF
# §2). Per-PE instantiation (4 independent PEs) lands with U1/R1.
core.threadCount=4
core.stdPeCount=1
core.cube_core_num=4
core.cube_thread_num=1
core.vec_core_num=4

# ---- PE Cluster layer (module-level guard; two-level: PeClusterEnabled -> per-tid) ----
fourpe.pe_cluster_enable=true
fourpe.pe_cluster_count=4
fourpe.pe_cluster_frontend_thread_count=4
fourpe.pe_cluster_aggregate_decode_width=8

# ---- per-tid partition capacities (Assumption A6; SPEROB=128/tid; block side split per P2-1) ----
fourpe.pe_cluster_gpr_rename_partition_entries=128
fourpe.pe_cluster_scalar_rob_partition_entries=128
fourpe.pe_cluster_scalar_iq_partition_entries=128
fourpe.pe_cluster_block_rob_partition_entries=256
fourpe.pe_cluster_block_iq_partition_entries=88
fourpe.pe_cluster_local_reg_partition_entries=88

# ---- frontend BRQ sizing (SMT4) ----
# BRQ holds one entry per in-flight fetch bundle (0x40 B of code) per tid, from F4
# delivery until block commit, so it must span the whole fetch->commit distance --
# not just BlockROB's allocate->commit window. Fetch runs far ahead of BlockROB
# allocation because bfu_be_q buffers 4096 insts, so BRQ's 256 x 0x40 B = 16 KB
# window is the tightest resource on the fetch path and saturates first. Observed
# at the deadlock: commit head 0x1666c vs fetch 0x1a780 = 0x4114 (~16.6 KB) > 16 KB.
# Once BRQ is full a tid's FBs can no longer leave the shared BFU F0-F4 pipe, and
# that pipe (a single global in-order stage chain, not per-tid) head-of-line blocks
# every other tid -- including the tid a Group CGI lockstep is waiting for.
# Measured: >=384 removes BRQ from the critical path (cycles identical for
# 384/512/768/1024 = 58223); 256 deadlocks at cycle 28724.
bfu.brq_depth=1024

# ---- isolation / diagnostics (A2 / A1 / A7) ----
fourpe.pe_cluster_partition_borrow_enable=false
fourpe.pe_cluster_eligible_rr_fairness_check=true
fourpe.pe_cluster_group_contract_fatal=false

# ---- SwimLane counter sampling (issue #350) ----
# Default interval=1 produces ~140MB JSON for 4-PE matmul (6 counters × 4 PE × every cycle).
# interval=4 produces 51.7 MB (over 50 MB target); interval=8 produces 37 MB (within target).
# See modelSpec/swimlane.md §3.4.
dfx.swimCounterSampleInterval=256

tlsu.fake_l2_enable=false

core.soc_random=false

core.soc_lat_random_seed=2

core.read_bandwidth_limit=128

core.write_bandwidth_limit=128

cell.tile_reg_size=256


dfx.tileRegOccupancy=true

core.soc_lat_dist=uniform

core.soc_lat_uniform_half_width=50

core.mean_read_latency=350

core.mean_write_latency=350

# Effective latency range: baseline 300 + uniform offset [0, 100] cycles.

bctrl.tile_lazy_alloc_enable=true
bctrl.tile_tload_bind_first_data_ready=true

core.soc_shared_bandwidth_limit=128

spe.speROBDepth=256
core.block_rob_depth=256

sl2.DATA_BANK_SIZE=64
sl2.DATA_BANK_TOTAL_SIZE=512
sl2.DATA_BANK_PORTS=1
sl2.DATA_BANK_SWIZZLE=0
sl2.TAG_PIPE_REQS_PER_CYCLE=2
