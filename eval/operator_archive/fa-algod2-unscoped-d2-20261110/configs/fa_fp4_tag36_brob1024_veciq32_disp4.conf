# Opt-in FA MXFP4 AlgoD exploration profile, mainline configuration keys.
# Usage from repository root: bin/gfsim -f <elf> --conf fa_fp4
# See fa_fp4.md for defaults, required inputs, environment and limitations.
# Four-PE bundle included; use this as the only --conf bundle.
# Resident tags pinned to 4 via cube.l0aResidentTagNum below; historical tag8
# is not reproduced.

# Four-PE bundle (explicit --conf disables automatic four-PE detection).
core.threadCount=4
core.stdPeCount=1
core.cube_core_num=4
core.cube_thread_num=1
core.vec_core_num=4
fourpe.pe_cluster_enable=true
fourpe.pe_cluster_count=4
fourpe.pe_cluster_frontend_thread_count=4
fourpe.pe_cluster_aggregate_decode_width=8
fourpe.pe_cluster_gpr_rename_partition_entries=128
fourpe.pe_cluster_scalar_rob_partition_entries=256
fourpe.pe_cluster_scalar_iq_partition_entries=128
fourpe.pe_cluster_block_rob_partition_entries=1024
fourpe.pe_cluster_block_iq_partition_entries=88
fourpe.pe_cluster_local_reg_partition_entries=88
bfu.brq_depth=1024
fourpe.pe_cluster_partition_borrow_enable=false
fourpe.pe_cluster_eligible_rr_fairness_check=true
fourpe.pe_cluster_group_contract_fatal=false

# Additional settings. Keys that mainline already defaults to the value below are
# still written out on purpose: an exploration profile should pin its knobs so a
# later mainline default change cannot silently retarget it.
dfx.swimCounterSampleInterval=256
# default: bctrl.vec_cell_sched_enable=false
bctrl.vecIssueQDepth=64
# KNOWN HAZARD (see fa_fp4.md "已知风险"): bctrl_bandwidth=8 together with
# spe.cmdDispatchBlocks=2 below triggers a pre-existing tile-rename ordering
# abort (mapQEntry[handType][tag].vld) and, on same-window nuke/mispred, a
# DCTop orphan-header deadlock. Mainline keeps these at 4 / 1 for that reason
# (configs/bctrl.toml, configs/spe.toml, docs/frontend_defaults_20261019.md,
# PR #1018 review). Kept here to match the historical exploration conditions.
bctrl.bctrl_bandwidth=8
spe.speROBDepth=256
core.block_rob_depth=1024
cube.l0aSharetregResident=true
# Pin resident tags to 4. This key exists since PR #1043 and defaults to 8 on
# current mainline; leaving it out silently yields the historical tag8 residency.
cube.l0aResidentTagNum=36
core.sharetreg_bandwidth_bytes=256
# default: cube.enable_internal_acc=true
spe.macroDescriptorFusion=true
spe.fusionTileBinders=true
# See the bctrl.bctrl_bandwidth hazard note above.
spe.cmdDispatchBlocks=4
spe.cmdDeferVecCapacity=true
bctrl.vecL2Rename=true
bctrl.vecL2Depth=48
bctrl.vecL2Poll=true
bctrl.vecResourceIq=true
bctrl.vecL1Init=true
bctrl.vecL1Depth=32
bctrl.vecRobDepth=64
core.soc_random=true
# Random-SoC latency means. core.soc_lat_mean / core.soc_bw_limit were removed
# on mainline (docs/frontend_defaults_20261019.md); use mean_*_latency directly.
# Bandwidth follows the mainline read/write_bandwidth_limit defaults (156 B/c),
# which is what soc_bw_limit=156 used to express, so no bandwidth override is
# written here. Both only take effect while core.soc_random=true.
core.mean_read_latency=260
core.mean_write_latency=260
# default: core.soc_lat_random_seed=1
bfu.hwpf_nl_degree=32
bfu.hwpf_max_pending_req=32
bfu.bhc_pf_nostd=32
bfu.bhc_nostd=40
